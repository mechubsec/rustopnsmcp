name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: One mecmcp pin
        run: scripts/check-mecmcp-pin.sh

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.89.0

      - name: Check workspace at MSRV
        run: |
          rustc --version
          cargo check --workspace --all-targets --locked

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Check RustSec advisories
        run: cargo audit --deny warnings

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

  # Secret scan: the shared mechubsec workflow (pinned gitleaks binary,
  # sha256-verified, output redacted; no license needed unlike
  # gitleaks-action on org repos). Matches rustunifimcp's security.yml.
  gitleaks:
    name: Secret scan
    uses: mechubsec/.github/.github/workflows/gitleaks.yml@1f46f69afab3cc1c77efa196747bc3a5e45a3755

  container-guard:
    name: Container argv guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify container argv
        run: |
          docker build -t rustopnsmcp:ci .

          # Config paths must survive operator overrides. Docker replaces CMD
          # entirely when the caller supplies args, but appends to ENTRYPOINT,
          # so security-relevant flags must live in ENTRYPOINT or they vanish
          # the moment anyone passes --host.
          container_id=$(docker create rustopnsmcp:ci --host 0.0.0.0)
          argv=$(docker inspect "$container_id" --format '{{join .Args "\n"}}')
          docker rm "$container_id" > /dev/null

          for p in /etc/rustopnsmcp/devices.json /var/lib/rustopnsmcp/tokens.json; do
            echo "$argv" | grep -q -- "$p" || { echo "FAIL: $p missing from argv with --host override"; exit 1; }
          done
          echo "PASS: config paths survive --host override"

  conformance:
    name: Package conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Under RUNNER_TEMP, never the checkout: a stray archive would dirty the
      # tree and BUILD-INFO would record git_dirty=true.
      - name: Install trivy
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          trivy_dir="${RUNNER_TEMP}/trivy"
          mkdir -p "$trivy_dir"
          curl -sSfL -o "${trivy_dir}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${trivy_dir}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${trivy_dir}/trivy.tar.gz" -C "$trivy_dir" trivy
          sudo install -m 0755 "${trivy_dir}/trivy" /usr/local/bin/trivy

      - name: Install logrotate
        run: command -v logrotate >/dev/null || { sudo apt-get update && sudo apt-get install -y logrotate; }

      - name: Shell static analysis
        run: shellcheck packaging/lxc/install.sh scripts/*.sh packaging/tests/*.sh

      - name: Build the release package
        run: scripts/package-lxc.sh

      - name: Package tests
        run: |
          set -euo pipefail
          packaging/tests/package-smoke.sh dist/rustopnsmcp-v*-x86_64-unknown-linux-gnu.tar.gz
          packaging/tests/package-refusals.sh
          packaging/tests/unit-contract.sh
          packaging/tests/logrotate.sh
          packaging/tests/skip-build-provenance.sh
          packaging/tests/installer-idempotence.sh
          packaging/tests/journald-dropin-ordering.sh

      # BUILD-INFO travels inside the tarball. Task 33's dry-run fetches the runner-built tarball with `gh run download`.
      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustopnsmcp-package
          path: |
            dist/rustopnsmcp-v*-x86_64-unknown-linux-gnu.tar.gz
            dist/rustopnsmcp-v*-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir staging
          tar -xzf dist/rustopnsmcp-v*-x86_64-unknown-linux-gnu.tar.gz -C staging --strip-components=1
          cp packaging/conformance.toml staging/conformance.toml

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: rustopnsmcp:conformance
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conformance
        uses: mechubsec/mecmcp/packaging/conformance@8557155ed1ecd24e7ae25948d70485f0fc8c8451 # v0.30.1
        with:
          staging: staging
          manifest: staging/conformance.toml
          image: rustopnsmcp:conformance
