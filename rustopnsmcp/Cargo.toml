[package]
name = "rustopnsmcp"
description = "Enterprise MCP server for OPNsense"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rustopnsmcp-core.workspace = true
mecmcp-audit.workspace = true
mecmcp-auth.workspace = true
mecmcp-changeset.workspace = true
mecmcp-redact.workspace = true
mecmcp-runtime.workspace = true
mecmcp-server.workspace = true
mecmcp-transport.workspace = true
rmcp.workspace = true
schemars.workspace = true
anyhow.workspace = true
clap.workspace = true
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
uuid.workspace = true

[features]
# OpenTelemetry export for `--otel-endpoint`. Off by default, as in mecmcp. A
# build without it refuses `--otel-endpoint` at startup instead of dropping
# the export.
otel = ["mecmcp-audit/otel"]

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
mecmcp-redact = { workspace = true, features = ["test-util"] }
mecmcp-audit  = { workspace = true, features = ["test-util"] }
rmcp          = { workspace = true, features = ["client"] }
serde_json.workspace = true
tokio         = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
